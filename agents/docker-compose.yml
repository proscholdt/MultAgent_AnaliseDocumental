name: agents

# Agentes: o orquestrador (API, porta 8200) e cada especialista no próprio serviço A2A, com o
# próprio Dockerfile (na pasta dele, agentes/<nome>/), a própria porta e a própria memória:
#   extrator 8201 · validador 8202 · analista 8203 · pesquisador 8204 · redator 8205
# Depende do indexador (sistema 1) e do servidor MCP (sistema 2) já no ar.
#   docker compose up -d --build --remove-orphans
#
# Os sistemas se falam pela rede Docker do indexador, pelo nome do serviço, sem passar pela
# máquina hospedeira. Se a rede tiver outro nome, defina INDEXER_NETWORK no .env.
#
# Chaves: `python -m app.ferramentas.cli gerar-chaves` cria ../chaves/<servico>/ (privada) e
# ../chaves/publicas/. Sem elas, vale o segredo compartilhado do .env, como antes.
#
# Especialista novo: `python -m app.ferramentas.cli novo-agente <nome> --descricao "..."` cria
# agentes/<nome>/ (arquivo e Dockerfile) e mostra o que colar aqui e no policy.yaml do MCP.

x-ambiente: &ambiente
  MCP_URL: ${MCP_URL_DOCKER:-http://mcp-server:8100/mcp}
  INDEXER_URL: ${INDEXER_URL_DOCKER:-http://api:8000}
  AGENTES_DIR: /app/agentes
  DATA_DIR: /data
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://alloy:4318} # observabilidade; vazio desliga
  # Vazio: arquivos e SQLite nos volumes (uma réplica de cada). Para várias réplicas, Postgres (o do
  # indexador serve; banco e tabelas criados na subida): AGENTS_DATABASE_URL=postgresql://indexer:indexer@postgres:5432/agentes
  DATABASE_URL: ${AGENTS_DATABASE_URL:-}

x-especialista: &especialista
  env_file:
    - path: .env
      required: false
  networks:
    - default
    - indexer

# Em cada especialista: a pasta dos agentes (editar o prompt vale na hora; o serviço só atende o
# agente dele), os ajustes (relidos a cada pedido) e o volume da memória dele, só dele.
services:
  extrator:
    <<: *especialista
    build: { context: ., dockerfile: agentes/extrator/Dockerfile }
    environment:
      <<: *ambiente
      ESPECIALISTA: extrator
      ESPECIALISTAS_URL: http://extrator:8201 # o endereço dele, que vai no Agent Card
    ports:
      - "8201:8201" # só para ver o Agent Card; quem chama é o orquestrador, pela rede interna
    volumes:
      - ./agentes:/app/agentes:ro
      - ./config:/app/config:ro
      - ../dominios:/app/dominios:ro # pacotes de domínio (dominios/<id>/dominio.yaml)
      - memoria-extrator:/data
      - ../chaves/extrator:/run/chaves/propria:ro # a chave privada dele, só dele (gerar-chaves)
      - ../chaves/publicas:/run/chaves/publicas:ro

  validador:
    <<: *especialista
    build: { context: ., dockerfile: agentes/validador/Dockerfile }
    environment:
      <<: *ambiente
      ESPECIALISTA: validador
      ESPECIALISTAS_URL: http://validador:8202
    ports:
      - "8202:8202"
    volumes:
      - ./agentes:/app/agentes:ro
      - ./config:/app/config:ro
      - ../dominios:/app/dominios:ro # pacotes de domínio (dominios/<id>/dominio.yaml)
      - memoria-validador:/data
      - ../chaves/validador:/run/chaves/propria:ro # a chave privada dele, só dele (gerar-chaves)
      - ../chaves/publicas:/run/chaves/publicas:ro

  analista:
    <<: *especialista
    build: { context: ., dockerfile: agentes/analista/Dockerfile }
    environment:
      <<: *ambiente
      ESPECIALISTA: analista
      ESPECIALISTAS_URL: http://analista:8203
    ports:
      - "8203:8203"
    volumes:
      - ./agentes:/app/agentes:ro
      - ./config:/app/config:ro
      - ../dominios:/app/dominios:ro # pacotes de domínio (dominios/<id>/dominio.yaml)
      - memoria-analista:/data
      - ../chaves/analista:/run/chaves/propria:ro # a chave privada dele, só dele (gerar-chaves)
      - ../chaves/publicas:/run/chaves/publicas:ro

  pesquisador:
    <<: *especialista
    build: { context: ., dockerfile: agentes/pesquisador/Dockerfile }
    environment:
      <<: *ambiente
      ESPECIALISTA: pesquisador
      ESPECIALISTAS_URL: http://pesquisador:8204
    ports:
      - "8204:8204"
    volumes:
      - ./agentes:/app/agentes:ro
      - ./config:/app/config:ro
      - ../dominios:/app/dominios:ro # pacotes de domínio (dominios/<id>/dominio.yaml)
      - memoria-pesquisador:/data
      - ../chaves/pesquisador:/run/chaves/propria:ro # a chave privada dele, só dele (gerar-chaves)
      - ../chaves/publicas:/run/chaves/publicas:ro

  redator:
    <<: *especialista
    build: { context: ., dockerfile: agentes/redator/Dockerfile }
    environment:
      <<: *ambiente
      ESPECIALISTA: redator
      ESPECIALISTAS_URL: http://redator:8205
    ports:
      - "8205:8205"
    volumes:
      - ./agentes:/app/agentes:ro
      - ./config:/app/config:ro
      - ../dominios:/app/dominios:ro # pacotes de domínio (dominios/<id>/dominio.yaml)
      - memoria-redator:/data
      - ../chaves/redator:/run/chaves/propria:ro # a chave privada dele, só dele (gerar-chaves)
      - ../chaves/publicas:/run/chaves/publicas:ro

  orquestrador:
    build: { context: ., dockerfile: agentes/orquestrador/Dockerfile }
    env_file:
      - path: .env
        required: false
    environment:
      <<: *ambiente
      # Um endereço por especialista. Sem serviço que atenda todos: ESPECIALISTAS_URL vazio.
      ESPECIALISTAS_URL: ""
      ESPECIALISTAS_ENDERECOS: >-
        {"extrator": "http://extrator:8201", "validador": "http://validador:8202",
        "analista": "http://analista:8203", "pesquisador": "http://pesquisador:8204",
        "redator": "http://redator:8205"}
    ports:
      - "8200:8200"
    depends_on: [extrator, validador, analista, pesquisador, redator]
    networks:
      - default
      - indexer
    volumes:
      - ./agentes:/app/agentes:ro
      - ./config:/app/config:ro
      - ../dominios:/app/dominios:ro # pacotes de domínio (dominios/<id>/dominio.yaml)
      - ./avaliacao:/app/avaliacao:ro # o gabarito da nota ao fim de cada relatório
      - agents-data:/data # execuções, traces, mensagens dos agentes e o checkpoint das conversas
      - ../chaves/orquestrador:/run/chaves/propria:ro
      - ../chaves/publicas:/run/chaves/publicas:ro

networks:
  indexer:
    name: ${INDEXER_NETWORK:-indexer_default}
    external: true

volumes:
  agents-data: # do orquestrador
  memoria-extrator:
  memoria-validador:
  memoria-analista:
  memoria-pesquisador:
  memoria-redator:
