[project]
name = "agents"
version = "0.1.0"
description = "Orquestrador e especialistas: agentes que falam entre si por A2A e usam as ferramentas pelo servidor MCP"
requires-python = ">=3.12"
dependencies = [
    # Versões fixadas na série: as duas bibliotecas mudam de API entre versões.
    "openai-agents>=0.24,<0.25",
    "a2a-sdk>=1.3,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
