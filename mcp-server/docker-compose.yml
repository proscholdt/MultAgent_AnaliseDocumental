name: mcp-server

# Servidor MCP com governança. Depende do indexador (sistema 1) já no ar.
#   docker compose up --build
#
# O indexador roda em outro projeto do compose. Este serviço entra na rede Docker dele e o
# chama pelo nome do serviço (http://api:8000), sem passar pela máquina hospedeira: assim uma
# outra aplicação ocupando a porta 8000 do host não atrapalha.
# Indexador em outro lugar: defina INDEXER_URL no .env (e INDEXER_NETWORK, se a rede dele
# tiver outro nome).

services:
  mcp-server:
    build: .
    ports:
      - "8100:8100"
    env_file:
      - path: .env
        required: false
    environment:
      INDEXER_URL: ${INDEXER_URL:-http://api:8000}
      # SQLite no volume (padrão, uma réplica). Para várias réplicas, Postgres (o do indexador serve;
      # o banco é criado e migrado na subida): MCP_DATABASE_URL=postgresql+asyncpg://indexer:indexer@postgres:5432/mcp
      DATABASE_URL: ${MCP_DATABASE_URL:-sqlite+aiosqlite:////data/mcp.db}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://alloy:4318} # observabilidade; vazio desliga
    networks:
      - default
      - indexer
    volumes:
      - mcp-data:/data # base dos dados extraídos e da auditoria
      - ./config:/app/config:ro # policy.yaml e ajustes.yaml: editar vale na hora
      - ../chaves/publicas:/run/chaves/publicas:ro # com chaves, só tokens EdDSA do próprio serviço

networks:
  indexer:
    name: ${INDEXER_NETWORK:-indexer_default}
    external: true

volumes:
  mcp-data:
