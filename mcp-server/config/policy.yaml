# Política de governança: o que cada agente vê e pode chamar neste servidor.
#
# - Um agente só enxerga, em tools/list, as tools listadas aqui. Chamar outra é recusado e
#   fica registrado na auditoria.
# - Agente que não aparece neste arquivo não tem acesso a nada.
# - O arquivo é relido quando muda, sem reiniciar. Se ficar inválido (YAML quebrado, tool que
#   não existe), continua valendo a versão anterior, e o erro aparece em GET /governanca.
#
# Para criar um agente: (1) o arquivo dele no sistema dos agentes; (2) uma entrada aqui.
#
# As divisões que importam:
# - Cada tool que GRAVA tem um dono só: indicadores são do extrator, alertas de fonte do
#   validador, análise do analista, respostas do pesquisador, resumo e relatório do redator.
# - O orquestrador não lê trecho de documento (nenhuma tool de RAG): texto malicioso de um
#   PDF não chega a quem decide o que fazer.

agentes:
  orquestrador:
    tools: [listar_documentos, pendencias, ler_extracao]
    limites:
      chamadas_por_execucao: 60

  extrator:
    tools: [listar_documentos, buscar_trechos, ler_chunk, ler_pagina,
            salvar_campo, salvar_nao_encontrado, fechar_extracao, ler_extracao]
    limites:
      chamadas_por_execucao: 250

  validador:
    tools: [buscar_trechos, ler_chunk, ler_pagina, ler_extracao, ler_alertas,
            candidatos_inconsistencia, registrar_alerta, descartar_candidato, concluir_revisao]
    limites:
      chamadas_por_execucao: 120

  analista:
    tools: [listar_documentos, buscar_trechos, ler_chunk, ler_pagina,
            salvar_item_analise, registrar_ausencia_analise, ler_analise]
    limites:
      chamadas_por_execucao: 150

  pesquisador:
    tools: [listar_documentos, buscar_trechos, ler_chunk, ler_pagina, ler_extracao, ler_analise,
            ler_alertas, comparar_campos, salvar_resposta, ler_respostas]
    limites:
      chamadas_por_execucao: 150

  redator:
    tools: [listar_documentos, ler_extracao, ler_analise, ler_alertas, ler_respostas,
            salvar_resumo, montar_relatorio, ler_relatorio, montar_relatorio_documento,
            ler_relatorio_documento, pendencias]
    limites:
      chamadas_por_execucao: 80

  # Não é um agente com modelo: é o próprio sistema dos agentes, que no fim de cada execução
  # confere as pendências e lê o resultado para devolver ao usuário. Só leitura.
  sistema:
    tools: [listar_documentos, pendencias, ler_extracao, ler_analise, ler_alertas, ler_respostas,
            ler_relatorio, ler_relatorio_documento]
