[project]
name = "mcp-server"
version = "0.1.0"
description = "Servidor MCP com governança: única porta dos agentes para as ferramentas e para o RAG"
requires-python = ">=3.12"
dependencies = [
    # Versões fixadas na série: a API do SDK mudou da 1.x para a 2.x (FastMCP virou MCPServer).
    "mcp>=2.3,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-instrumentation-logging>=0.66b2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
