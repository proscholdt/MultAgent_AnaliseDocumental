# Migrações da base do servidor MCP (Postgres em produção; o SQLite dos testes usa create_all).
#   uv run alembic upgrade head                       aplica (DATABASE_URL do .env)
#   uv run alembic revision --autogenerate -m "..."   nova migração depois de mudar app/dados/modelos.py
[alembic]
script_location = %(here)s/migracoes
prepend_sys_path = .
path_separator = os
version_locations = %(here)s/migracoes/versoes
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
