# Pacote de domínio: demonstrações financeiras de empresas. O primeiro pacote, e o padrão (é o
# domínio dos documentos e das coleções de antes dos pacotes). O formato está em
# comum/pacotes.py; como criar um domínio, em dominios/README.md.
#
# Lido na subida de cada sistema (mudou aqui: reinicie os contêineres), porque o esquema das tools
# que os agentes veem sai daqui. Arquivo inválido impede a subida, com o motivo.

id: financeiro
nome: Demonstrações financeiras
descricao: >-
  Demonstrações financeiras de empresas (anuais, trimestrais, releases): indicadores com a origem
  de cada valor, análise do comentário da administração, perguntas comparativas e o relatório
  consolidado para um analista financeiro.
# As fórmulas (EBITDA, dívida líquida, alavancagem, capex), as validações e as regras de
# inconsistência deste domínio são código: o plugin "financeiro" de cada sistema.
plugin: financeiro

documento:
  tipos:
  - Demonstrações financeiras anuais
  - Informações trimestrais
  - Release de resultados
  reconhecer:
  - Balanço patrimonial
  - Demonstração do resultado do exercício
  - Demonstração dos fluxos de caixa
  - Notas explicativas às demonstrações financeiras
  - Relatório do auditor independente sobre as demonstrações financeiras individuais e consolidadas

entidade:
  nome: empresa
  rotulo: Empresa
  plural: Empresas
  ausente: Empresa não identificada

recorte:
  nome: periodo
  rotulo: Período
  tipo: periodo
  ausente: período não identificado

# O que o indexador extrai de cada documento. Cada valor só vale com o trecho da página que o prova.
metadados:
- nome: empresa
  rotulo: Empresa
  papel: entidade
  instrucao: razão social da empresa que reporta (não o auditor nem uma controlada citada)
- nome: periodo
  rotulo: Período
  papel: recorte
  tipo: periodo
  instrucao: >-
    período de referência, '2022' para exercício anual findo em 31/12/2022 ou '3T25' para o
    terceiro trimestre de 2025
- nome: tipo_documento
  rotulo: Tipo de documento
  papel: tipo_documento
  instrucao: >-
    tipo do documento, por exemplo 'Demonstrações financeiras anuais', 'Informações trimestrais'
    ou 'Release de resultados'

textos:
  titulo: Análise de Demonstrações
  envio: Envie as demonstrações financeiras em PDF.
  fora_do_escopo: >-
    Isso está fora do escopo deste sistema. Ele responde perguntas sobre as demonstrações
    financeiras enviadas, sempre com a página de origem, e gera relatórios: o consolidado ou o de
    uma empresa. Escolha uma das opções ou escreva a sua pergunta.
  opcoes:
  - titulo: Perguntar sobre um indicador
    exemplo: Qual empresa teve a maior margem EBITDA?
  - titulo: Comparar as empresas
    exemplo: Compare o lucro líquido das empresas
  - titulo: Entender o resultado
    exemplo: Quais riscos as empresas destacam?
  - titulo: Gerar o relatório de uma empresa
    exemplo: Gere o relatório da Brasal
  - titulo: Gerar o relatório consolidado
    exemplo: Gere o relatório consolidado completo
  relatorio:
    titulo: Relatório de análise das demonstrações financeiras
    como_ler: >-
      Todo número deste relatório foi lido do documento pelo código (célula de tabela ou trecho
      conferido) ou calculado por fórmula fixa a partir desses valores. O que a empresa não informa
      aparece como "não informado", e o que foi calculado vem marcado como calculado. As páginas
      ("p.") são as do arquivo PDF, contadas da primeira folha, e não a numeração impressa no
      documento, que costuma recomeçar nas demonstrações financeiras.
    campo: Indicador
    secao_campos: Indicadores
    secao_comparados: Indicadores comparados
    todos_encontrados: Todos os indicadores foram informados pela empresa.

# --- Campos, categorias e perguntas ----------------------------------------------------------------
#
# Para um indicador novo (ex.: patrimônio líquido): uma entrada em `campos`, a linha no prompt do
# extrator e o valor no gabarito. Sem Python.
#
# campos:
#   nome        identificador (minúsculas e _), o que os agentes usam ao gravar
#   rotulo      como aparece no relatório
#   tipo        valor (dinheiro) | percentual | multiplo | numero | data | texto
#   principal   true: um dos indicadores do relatório; false: valor de apoio das fórmulas
#   termos      procurados no documento quando o agente diz que o campo não existe; se algum
#               aparece, ele tem de dizer por que aquelas páginas não servem
#   secao       palavra que a seção de origem deve ter quando o valor vem de tabela (outra seção
#               entra, mas gera alerta)
#   mencao      o que a linha (ou o trecho) de origem tem de mencionar, sem acento; "a+b" exige
#               as duas partes
#   demonstracao  true: o valor vem da tabela da demonstração, nunca de uma frase do relatório
#
# Os campos usados pelas fórmulas (EBITDA, dívida líquida, alavancagem, capex) são obrigatórios
# pelo plugin financeiro do servidor MCP.
#
# perguntas: as do relatório, na ordem em que aparecem. O id é o que o orquestrador cita (p1...).
campos:
- nome: receita_liquida
  rotulo: Receita líquida
  tipo: valor
  principal: true
  termos:
  - receita líquida
  - receita operacional líquida
  secao: resultado
  mencao:
  - receita
  demonstracao: true
- nome: ebitda
  rotulo: EBITDA
  tipo: valor
  principal: true
  termos:
  - ebitda
  - lajida
  mencao:
  - ebitda
  - lajida
- nome: margem_ebitda
  rotulo: Margem EBITDA
  tipo: percentual
  principal: true
  termos:
  - margem ebitda
  - margem lajida
  - margem do ebitda
  mencao:
  - ebitda
  - lajida
- nome: lucro_liquido
  rotulo: Lucro líquido
  tipo: valor
  principal: true
  termos:
  - lucro líquido
  - prejuízo líquido
  - resultado líquido
  - prejuízo do exercício
  secao: resultado
  mencao:
  - lucro
  - prejuizo
  - resultado liquido
  - resultado do exercicio
  - resultado do periodo
  demonstracao: true
- nome: divida_liquida
  rotulo: Dívida líquida
  tipo: valor
  principal: true
  termos:
  - dívida líquida
  - endividamento líquido
  mencao:
  - divida liquida
  - endividamento liquido

# "Alavancagem" e "índice de endividamento" nomeiam contas diferentes em cada empresa; o campo
# daqui é dívida líquida / EBITDA, então a fonte tem de falar em EBITDA.
- nome: alavancagem
  rotulo: Alavancagem (dívida líquida / EBITDA)
  tipo: multiplo
  principal: true
  termos:
  - alavancagem
  - dívida líquida/ebitda
  - dívida líquida / ebitda
  - dívida líquida sobre ebitda
  mencao:
  - ebitda
  - lajida
- nome: fluxo_caixa_operacional
  rotulo: Fluxo de caixa operacional
  tipo: valor
  principal: true
  termos:
  - atividades operacionais
  secao: fluxo
  mencao:
  - caixa+operacionais
  - caixa+operacoes
  demonstracao: true

# O capex informado é um total de investimentos que a empresa declara. As linhas de aquisição do
# fluxo de caixa são valores de apoio (campos capex_*), e o servidor soma.
- nome: capex
  rotulo: Capex
  tipo: valor
  principal: true
  termos:
  - capex
  - aquisição de imobilizado
  - aquisições de imobilizado
  - aquisição de ativo imobilizado
  - aquisições de bens do ativo imobilizado
  - adições ao imobilizado
  secao: fluxo
  mencao:
  - capex
  - total de investimento
  - investimentos totais
  - investimentos realizados
- nome: resultado_antes_financeiro
  rotulo: Resultado antes do resultado financeiro
  tipo: valor
  principal: false
  secao: resultado
  mencao:
  - antes+financeir
  - lucro operacional
  - resultado operacional
- nome: depreciacao_amortizacao
  rotulo: Depreciação e amortização
  tipo: valor
  principal: false
  mencao:
  - deprecia
- nome: emprestimos_circulante
  rotulo: Empréstimos e financiamentos (circulante)
  tipo: valor
  principal: false
  secao: balanço
  mencao:
  - emprestimo
  - financiamento
- nome: emprestimos_nao_circulante
  rotulo: Empréstimos e financiamentos (não circulante)
  tipo: valor
  principal: false
  secao: balanço
  mencao:
  - emprestimo
  - financiamento

# Na nota de caixa, "Caixa e bancos" é um componente; o valor é o da linha do total.
- nome: caixa_equivalentes
  rotulo: Caixa e equivalentes de caixa
  tipo: valor
  principal: false
  secao: balanço
  mencao:
  - caixa e equivalente
- nome: capex_imobilizado
  rotulo: Aquisição de imobilizado
  tipo: valor
  principal: false
  secao: fluxo
  mencao:
  - imobilizado
- nome: capex_intangivel
  rotulo: Aquisição de intangível
  tipo: valor
  principal: false
  secao: fluxo
  mencao:
  - intangivel

# Algumas empresas têm uma linha só no fluxo de caixa ("Imobilizado e intangível"). Ela entra
# aqui, e não nos dois campos de capex acima: gravada duas vezes, o capex sairia dobrado.
- nome: capex_imobilizado_e_intangivel
  rotulo: Aquisição de imobilizado e intangível (linha única)
  tipo: valor
  principal: false
  secao: fluxo
  mencao:
  - imobilizado+intangivel

categorias:
- nome: motivo_resultado
  rotulo: Principais motivos do resultado
- nome: risco
  rotulo: Riscos e pontos de atenção
  termos:
  - risco
- nome: guidance
  rotulo: Guidance e perspectivas
  termos:
  - guidance
  - perspectiva
  - projeç
  - expectativa

# Termos específicos: "aquisição" sozinha casaria com a linha de capex do fluxo de caixa, e
# "contingência", com a nota de provisões de qualquer demonstração.
- nome: evento_relevante
  rotulo: Eventos relevantes
  termos:
  - evento subsequente
  - eventos subsequentes
  - combinação de negócios
  - reestruturaç
  - recuperação judicial
- nome: tom
  rotulo: Tom geral da administração

perguntas:
- id: p1
  enunciado: Qual empresa teve a maior margem EBITDA no período?
- id: p2
  enunciado: O que a administração de cada empresa apontou como principal motivo da variação da receita?
- id: p3
  enunciado: Alguma das empresas está com alavancagem acima de 3x? Qual?
- id: p4
  enunciado: Quais riscos são citados por mais de uma empresa?
- id: p5
  enunciado: Qual é o guidance de cada empresa para o próximo ano?
