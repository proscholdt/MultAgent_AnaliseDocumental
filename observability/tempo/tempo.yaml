# Tempo em modo monolítico, com armazenamento local. Guarda 3 dias de traces e gera, a partir
# deles, as métricas de RED por serviço e o mapa de serviços (enviados ao Prometheus).
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 72h

metrics_generator:
  registry:
    external_labels:
      origem: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces
  # Métricas por TraceQL (os painéis filtrados por conversa) de todos os spans, não só dos de
  # entrada: o span da execução, o de cada tool e o de cada chamada ao modelo também contam.
  # flush_to_storage grava os blocos do gerador no disco: é deles que saem as métricas de mais de
  # 30 minutos atrás (sem isso, os painéis só enxergam a última meia hora).
  processor:
    local_blocks:
      filter_server_spans: false
      flush_to_storage: true

query_frontend:
  metrics:
    max_duration: 72h # o mesmo que a retenção

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]
