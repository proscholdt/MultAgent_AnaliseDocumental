# Sobe o sistema só com o parser da Azure, sem construir a imagem do Docling (4,3 GB).
#
#   docker compose -f docker-compose.yml -f docker-compose.azure.yml up --build
#
# O parse-worker passa a usar a imagem leve, a mesma da API, que não tem o Docling: deixe
# `parser: azure` no config/ajustes.yaml. Exige AZURE_DI_ENDPOINT e AZURE_DI_KEY no .env. Para
# alternar entre os dois parsers, use só o docker-compose.yml (a imagem do alvo "parse" roda os
# dois) e mude `parser` no config/ajustes.yaml.

services:
  parse-worker:
    # Nome próprio para não sobrescrever a imagem do Docling, se ela já tiver sido construída.
    image: indexer-parse-worker-azure
    build:
      target: light
