name: indexer

# Infra (kafka, postgres, qdrant) + aplicação (api, parse-worker, index-worker).
#   Tudo:        docker compose up --build
#   Só a infra:  docker compose up -d kafka postgres qdrant   (e rode a aplicação com uv)
#   Escalar:     docker compose up -d --scale parse-worker=2 --scale index-worker=3

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://indexer:indexer@postgres:5432/indexer
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  QDRANT_URL: http://qdrant:6333
  STORAGE_DIR: /data/storage
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://alloy:4318} # observabilidade; vazio desliga

x-app-depends: &app-depends
  kafka:
    condition: service_healthy
  postgres:
    condition: service_healthy
  qdrant:
    condition: service_started

services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "29092:29092" # acesso a partir do host (aplicação rodando fora do Docker)
    environment:
      # KRaft: um único nó faz papel de broker e de controller, sem ZooKeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Os tópicos são criados pela aplicação, com partições definidas; nada de criação implícita.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Tela para ver tópicos, partições, mensagens e grupos de consumo: http://localhost:8080
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: indexador
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      JAVA_OPTS: -Xmx256m
      LOGGING_LEVEL_ROOT: warn # sem isso, uma linha de DEBUG a cada 30 s no Loki
      LOGGING_LEVEL_IO_KAFBAT: warn
      LOGGING_LEVEL_IO_KAFBAT_UI: warn # a configuração da imagem põe io.kafbat.ui em DEBUG
    depends_on:
      kafka:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: indexer
      POSTGRES_PASSWORD: indexer
      POSTGRES_DB: indexer
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indexer -d indexer"]
      interval: 5s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "6333:6333" # API REST e dashboard em /dashboard
    volumes:
      - qdrant-data:/qdrant/storage

  api:
    build:
      context: .
      target: light
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment: *app-env
    volumes:
      - storage:/data/storage
      - ./config:/app/config:ro # ajustes.yaml: relido sem reiniciar
      - ../dominios:/app/dominios:ro # pacotes de domínio (dominios/<id>/dominio.yaml)
    depends_on: *app-depends

  parse-worker:
    build:
      context: .
      target: parse
    command: python -m app.workers.parse_worker
    env_file:
      - path: .env
        required: false
    environment: *app-env
    volumes:
      - storage:/data/storage
      - ./config:/app/config:ro # ajustes.yaml: relido sem reiniciar
      - ../dominios:/app/dominios:ro # pacotes de domínio (dominios/<id>/dominio.yaml)
    depends_on: *app-depends

  index-worker:
    build:
      context: .
      target: light
    command: python -m app.workers.index_worker
    env_file:
      - path: .env
        required: false
    environment: *app-env
    volumes:
      - storage:/data/storage
      - ./config:/app/config:ro # ajustes.yaml: relido sem reiniciar
      - ../dominios:/app/dominios:ro # pacotes de domínio (dominios/<id>/dominio.yaml)
    depends_on: *app-depends

volumes:
  kafka-data:
  postgres-data:
  qdrant-data:
  storage: # PDFs e artefatos de parse, compartilhados entre api e workers
